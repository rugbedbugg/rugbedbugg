name: Refresh profile

on:
  # Regenerate every 3 hours so live stats and the rotating quote stay current
  schedule:
    - cron: "0 */3 * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # Re-render when the generator changes
  push:
    branches: ["main"]
    paths:
      - "assets/build.py"
      - "assets/builder/**"

# The job commits regenerated SVGs back into the repo
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate profile panels
        env:
          # Raises the GitHub API rate limit for the live-data fetch
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python assets/build.py

      - name: Commit refreshed panels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refresh profile panels [skip ci]"
            git push
          fi
