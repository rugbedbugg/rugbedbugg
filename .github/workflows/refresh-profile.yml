name: Refresh profile

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'assets/build.py'
      - 'assets/builder/**'
      - 'scripts/**'
      - 'tests/**'
      - 'mise.toml'
      - '.python-version'
      - 'requirements-dev.txt'

permissions:
  contents: read

concurrency:
  group: profile-publication
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  refresh:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: jdx/mise-action@v2
      - run: mise run install
      # A queued refresh can see a newer main than the validation job did.
      - name: Validate the exact checkout before generation
        run: mise run check
      - name: Regenerate profile panels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run build
      - name: Publish signed changes and verify remote panels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise exec -- uv run --no-project python scripts/publish.py
